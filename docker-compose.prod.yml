# RagNex production-style stack.
#
#   cp .env.prod.example .env.prod      # then fill in the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only the frontend (nginx) publishes a port. It serves the app and proxies /api to the
# API, so the browser uses one origin. Postgres, Redis, OpenSearch, MinIO and the API are
# reachable only on the internal network.
#
# The LLM and embedding model run outside this stack (default: Ollama on the Docker host).

name: ragnex

x-backend: &backend
  # RAGNEX_IMAGE_PREFIX=ghcr.io/<owner>/ uses the images CI publishes (docker compose pull);
  # empty = images built locally (up --build). See docs/deployment.md.
  image: ${RAGNEX_IMAGE_PREFIX:-}ragnex-backend:${RAGNEX_VERSION:-latest}
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  restart: unless-stopped
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ragnex}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ragnex}
    REDIS_URL: redis://redis:6379/0
    OPENSEARCH_URL: http://opensearch:9200
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ragnex}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (e.g. openssl rand -hex 32)}
    RAGNEX_ENCRYPTION_KEY: ${RAGNEX_ENCRYPTION_KEY:?set RAGNEX_ENCRYPTION_KEY (e.g. openssl rand -base64 32)}
    RAGNEX_ENCRYPTION_PREVIOUS_KEYS: ${RAGNEX_ENCRYPTION_PREVIOUS_KEYS:-[]}
    # Same origin behind nginx, so no cross-origin access is needed.
    CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
    LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    LLM_MODEL: ${LLM_MODEL:-llama3}
    LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
    LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-8192}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    VLLM_BASE_URL: ${VLLM_BASE_URL:-}
    TENANT_MODEL_BASE_URLS: ${TENANT_MODEL_BASE_URLS:-[]}
    LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
    CHAT_SUMMARY_ENABLED: ${CHAT_SUMMARY_ENABLED:-true}
    EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
    EMBEDDING_RPS: ${EMBEDDING_RPS:-5}
    ACCESS_TOKEN_EXPIRES_MINUTES: ${ACCESS_TOKEN_EXPIRES_MINUTES:-30}
    REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-14}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Optional re-ranker (docs/deployment.md#re-ranking). none = off.
    RERANK_PROVIDER: ${RERANK_PROVIDER:-none}
    RERANK_BASE_URL: ${RERANK_BASE_URL:-}
    RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
    RERANK_API_KEY: ${RERANK_API_KEY:-}
    RERANK_CANDIDATES: ${RERANK_CANDIDATES:-15}
    REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
    REGISTRATION_EMAIL_DOMAINS: ${REGISTRATION_EMAIL_DOMAINS:-[]}
    # Only the variables listed here reach the containers. To set another backend option
    # (docs/configuration.md), add it to this list.
  extra_hosts:
    # Lets containers reach services on the Docker host (e.g. Ollama) on Linux too.
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragnex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ragnex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Security plugin off: OpenSearch is only reachable on the internal network.
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    # The official minio/minio image is no longer published (Docker Hub repository removed).
    # Chainguard's maintained build of the same MinIO server; it only publishes :latest, so
    # it's pinned by digest (MinIO RELEASE.2026-11-23). To update: docker pull
    # cgr.dev/chainguard/minio:latest, then replace the digest with the new one.
    image: cgr.dev/chainguard/minio@sha256:b288eaa709ba2f799a39e9a8ceda71a08fabf90109b12c90badba9afff29485c
    # Root, as with the old image: existing volumes were written by root, and the image's
    # default user (65532) couldn't write to them.
    user: "0:0"
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ragnex}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      # The image has no curl or grep: bash makes the request and checks the status line.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Applies database migrations, then exits. The API and worker wait for it to succeed.
  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      API_WORKERS: ${API_WORKERS:-2}
      # The API port isn't published: only nginx on the internal network can reach it,
      # and nginx replaces X-Forwarded-For with the client IP it worked out (it never
      # passes on what the client sent), so trusting the header from any peer is safe.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Parses, embeds and indexes uploads, and purges deleted documents.
  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Optional re-ranker: Hugging Face Text Embeddings Inference serving a cross-encoder.
  # Started only with the "rerank" profile:
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile rerank up -d
  # and used with RERANK_PROVIDER=tei, RERANK_BASE_URL=http://reranker. It downloads the
  # model from Hugging Face on first start. The default is a small multilingual model that
  # is practical on CPU; larger ones (e.g. BAAI/bge-reranker-v2-m3) need a GPU image.
  # --max-batch-tokens keeps start-up memory in check (the default ran out of memory).
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    profiles: ["rerank"]
    restart: unless-stopped
    command:
      - --model-id
      - ${RERANK_TEI_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      - --max-batch-tokens
      - "4096"
    volumes:
      - rerankerdata:/data

  frontend:
    image: ${RAGNEX_IMAGE_PREFIX:-}ragnex-frontend:${RAGNEX_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      RAGNEX_API_UPSTREAM: api:8000
      RAGNEX_MAX_UPLOAD_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      # Your TLS proxy's address as seen by this container (see docs/deployment.md).
      RAGNEX_TRUSTED_PROXY: ${RAGNEX_TRUSTED_PROXY:-127.0.0.1/32}
    ports:
      - "${RAGNEX_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine "localhost" resolves to ::1 first, and nginx
      # listens on IPv4 only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rerankerdata:
  pgdata:
  redisdata:
  opensearchdata:
  miniodata:
