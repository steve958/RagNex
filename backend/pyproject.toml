[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Dependency manifest only: the code is imported as `backend.app.*` from the repo root
# (see README), so installing this project installs its dependencies and no modules.
[tool.setuptools]
py-modules = []

[project]
name = "ragnex-backend"
version = "0.0.1"
description = "Backend services for RagNex (RAGFlow replacement)"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.0",  # [asyncio] pulls in greenlet, required by AsyncSession
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "redis>=5.0.0",
  "celery>=5.3.0",
  "minio>=7.2.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.2.0",
  "python-multipart>=0.0.6",
  "httpx>=0.26.0",
  "structlog>=24.4.0",
  "opensearch-py>=2.4.0",
  # Auth: JWTs, password hashing, EmailStr validation, rate limiting
  "PyJWT>=2.8.0",
  "passlib>=1.7.4",
  "argon2-cffi>=23.1.0",
  "email-validator>=2.1.0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "black>=24.0.0",
  "mypy>=1.8.0",
  # Security scanning: bandit -r backend/app ; pip-audit
  "bandit>=1.8.0",
  "pip-audit>=2.7.0",
  "pytest-cov>=6.0.0",
]

# DeepDoc parsing stack (text extraction + basic file parsers)
deepdoc = [
  "pypdf>=4.0.0",
  "pdfplumber>=0.11.0",
  "pillow>=10.0.0",
  "numpy>=1.26.0",
  "huggingface-hub>=0.20.0",
  "chardet>=5.0.0",
  "python-docx>=1.1.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "python-pptx>=0.6.23",
  "beautifulsoup4>=4.12.0",
  "html5lib>=1.1",
  "markdown>=3.6",
]

# DeepDoc vision/OCR stack (heavier native deps)
deepdoc-vision = [
  "onnxruntime>=1.16.0",
  "opencv-python>=4.9.0",
  "shapely>=2.0.0",
  "pyclipper>=1.3.0",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

# Coverage: run from backend/ with `python -m pytest --cov`. Measures the app and the DeepDoc
# parsers it uses; parsers for out-of-scope formats (resume, MinerU, TCADP, Docling, figures)
# are never called, so they're excluded rather than counted as untested.
[tool.coverage.run]
branch = true
# SQLAlchemy's asyncio mode runs database calls in greenlets; without this, every line
# after an awaited query is reported as never run.
concurrency = ["thread", "greenlet"]
source = ["app", "../deepdoc/parser"]
omit = [
  "*/deepdoc/parser/resume/*",
  "*/deepdoc/parser/mineru_parser.py",
  "*/deepdoc/parser/tcadp_parser.py",
  "*/deepdoc/parser/docling_parser.py",
  "*/deepdoc/parser/figure_parser.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
