# Tests every pull request and push. Pushes to master and version tags (v1.2.3) then
# build both images and publish them to the GitHub Container Registry:
#   ghcr.io/<owner>/ragnex-backend, ghcr.io/<owner>/ragnex-frontend
#
# Third-party actions are pinned to a commit (tag in the comment), so a moved tag can't
# change what runs here.

name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to the same pull request makes the older run pointless.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ragnex
          POSTGRES_PASSWORD: ragnex
          POSTGRES_DB: ragnex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragnex -d ragnex"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          # OpenSearch refuses to start with a password resembling the user name "admin".
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: Ragnex-Ci-7f3k-Pass!
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://ragnex:ragnex@localhost:5432/ragnex
      REDIS_URL: redis://localhost:6379/0
      OPENSEARCH_URL: http://localhost:9200
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      # Fail instead of skipping tests when a data store is unreachable.
      RAGNEX_TESTS_REQUIRE_STACK: "1"
      # JWT_SECRET and RAGNEX_ENCRYPTION_KEY: the tests set their own (tests/conftest.py).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Service containers can't be given a command, and MinIO needs `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock doesn't match pyproject.toml (run `uv lock` and commit).
      - name: Install dependencies from the lockfile
        working-directory: backend
        run: uv sync --locked --extra dev --extra deepdoc

      - name: Backend tests
        working-directory: backend
        run: uv run --no-sync python -m pytest -q --cov

      - name: DeepDoc tests
        working-directory: deepdoc
        run: uv run --project ../backend --no-sync python -m pytest -q tests

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --run --coverage
      - run: npm run build

  images:
    name: Publish ${{ matrix.image }} image
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # master -> :master, :latest and :sha-<commit>; tag v1.2.3 -> :1.2.3 and :1.2
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ragnex-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
